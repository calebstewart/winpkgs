name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  nix:
    name: evaluate example configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      # A substituter over the GitHub Actions cache, for the winget-pkgs input
      # above all: a commit of it is hundreds of thousands of small files, and
      # without this every run fetches and unpacks it into the store again.
      - uses: DeterminateSystems/magic-nix-cache-action@v14
      - run: nix flake check --print-build-logs
      - run: |
          nix build .#checks.x86_64-linux.example --print-build-logs
          echo '--- config.json ---'
          cat result/config.json
          echo '--- closure ---'
          find result/ -maxdepth 2

  runtime:
    name: runtime tests (pwsh)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # install.ps1 and bootstrap.ps1 both run on a machine whose only PowerShell
      # is 5.1, so they must parse there.
      - name: Syntax-check under Windows PowerShell 5.1
        shell: powershell
        run: |
          $failed = $false
          @(Get-Item install.ps1) + @(Get-ChildItem -Recurse runtime -Include *.ps1, *.psm1, *.psd1) | ForEach-Object {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors) { $failed = $true; $errors | ForEach-Object { Write-Host "$($_.Extent.File):$($_.Extent.StartLineNumber): $($_.Message)" } }
          }
          if ($failed) { exit 1 }
      - name: Lint
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $results = @(Invoke-ScriptAnalyzer -Path runtime -Recurse -Severity Error) +
                     @(Invoke-ScriptAnalyzer -Path install.ps1 -Severity Error)
          $results | Format-Table -AutoSize
          if ($results.Count) { exit 1 }
      - name: Pester (pwsh 7)
        shell: pwsh
        run: |
          Install-Module Pester -MinimumVersion 5.5 -Force -Scope CurrentUser
          $cfg = New-PesterConfiguration
          $cfg.Run.Path = 'runtime/tests'
          $cfg.Run.Exit = $true
          $cfg.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $cfg
      # The elevated phase runs under Windows PowerShell when pwsh is the MSIX
      # build, so the runtime must pass on 5.1 too.
      - name: Pester (Windows PowerShell 5.1)
        shell: powershell
        run: |
          Install-Module Pester -MinimumVersion 5.5 -Force -SkipPublisherCheck -Scope CurrentUser
          $cfg = New-PesterConfiguration
          $cfg.Run.Path = 'runtime/tests'
          $cfg.Run.Exit = $true
          $cfg.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $cfg
